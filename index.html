<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>My DevOps App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { font-size: 3em; margin-bottom: 20px; }
        .emoji { font-size: 4em; display: block; margin-bottom: 10px; }
        p { font-size: 1.2em; margin: 10px 0; }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="emoji">🚀</span>
        <h1>DevOps Phase 1</h1>
        <p>Nginx is running successfully!</p>
        <p>Server: <strong>Ubuntu 26.04</strong> | User: <strong>gholy</strong></p>
        <p>IP: <strong>192.168.1.101</strong></p>
        <div class="badge">Powered by HamGit + ArvanCloud Journey</div>
    </div>
</body>
</html>
